# guard-spec section 2.7: incident fixture suite. Every I row must deny
# (zero escapes), every C row must allow or ask (zero control denies).
# Paths use the templates {HOME}, {REPO}, {TMP}; the test lays out a
# sandbox with a git repository at {REPO} (src/main.go, script.py,
# package.json, Makefile, build/, node_modules/), a vault at
# {TMP}/vault/notes and a home at {HOME} with .ssh and Documents.
# `env` lists KEY=VALUE pairs the shell would see; a variable that is not
# listed is unset. permission_mode defaults to acceptEdits for controls.
# `rules` lists rule ids that must appear in the decision; `segment` pins
# a rule to one segment index. `skip` marks shells not implemented yet.

[[fixture]]
id = "I-01"
source = "claude-code #10077, rm -rf expanded from ~/ (doc 06 A.1)"
shell = "bash"
raw = "rm -rf ~/ project/build"
expect = "deny"
rules = ["D1"]
argv = { segment = 0, index = 2, value = "{HOME}/" }

